; Freenove ESP32-S3 2.8" CYD (FNK0104AB) standalone cloud voice assistant
;
; Official platformio/platform-espressif32 is still pinned to Arduino-ESP32 2.x.
; ESP_I2S.h (used for mic record / speaker playback) needs Arduino-ESP32 3.x,
; so this project uses the pioarduino community platform fork instead.

[env:freenove-cyd-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Board memory (16MB flash, 8MB Octal PSRAM) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; FT6336U is vendored under lib/FT6336U (patched to bound its I2C retry loop --
; see lib/FT6336U/src/FT6336U.cpp) rather than pulled via lib_deps, same as es8311.
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17

build_flags =
    ; ---- PSRAM ----
    -DBOARD_HAS_PSRAM

    ; ---- Route Serial over the native USB-Serial/JTAG port (this board has
    ; no separate UART bridge chip, so without this Serial.print() output
    ; never reaches the COM port used for flashing/monitoring) ----
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ---- TFT_eSPI: FNK0104AB 2.8" ILI9341 setup, provided entirely via build_flags ----
    ; (equivalent of Freenove's Libraries/FNK0104AB/TFT_eSPI_Setups_v1.3/FNK0104AB_2.8_240x320_ILI9341.h)
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
